name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every job here only reads the repository and runs tests. Declaring this at
# the top level means the GITHUB_TOKEN handed to CI cannot write to the repo
# even if a step is compromised, rather than inheriting whatever the account
# default happens to be.
permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript build (mcp-server, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu matches the production runtime; windows is the primary
        # development platform. Without the windows leg, path-separator bugs
        # (getRelativePath emits "/" while path.sep is "\\") fail only on the
        # developer's machine and stay green on main indefinitely.
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # The Node LTS line. The runtime image (node:26-slim) is built and
          # exercised by the docker job below.
          node-version: '22'
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - run: npm ci
      - run: npm run build
      # Coverage thresholds gate merges on the production platform only, so the
      # per-file floors in vitest.config.ts have a single source of truth.
      - if: matrix.os == 'ubuntu-latest'
        run: npm run test:coverage
      - if: matrix.os != 'ubuntu-latest'
        run: npm test

  lint:
    name: Lint + format (mcp-server)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - run: npm ci
      # ESLint fails on errors only; `no-explicit-any` is a warning by design
      # (see eslint.config.js) so it does not block a merge.
      - run: npm run lint
      - run: npm run format:check

  python:
    name: Python syntax (integrations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m compileall -q integrations
      - run: pip install -q pytest
      - run: python -m pytest integrations/test_orchestrator_hook.py -q

  shell:
    name: Shellcheck (scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/tests/sync_scripts_test.sh
      - run: shellcheck --severity=warning scripts/*.sh scripts/sync/*.sh deploy/gcp/*.sh

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Nothing else in CI touches the Dockerfile, so a base-image bump or a
      # native-module break reached main unverified -- the tests run on the
      # runner's own Node, never on the image that actually ships. better-sqlite3
      # compiles from source in the builder stage, which is exactly the step a
      # Node major is most likely to break.
      - name: Build the image
        run: docker build -t memoria:ci .
      # What the Dockerfile promises about the runtime image, checked as the
      # user the service runs as. The image used to ship the whole dev
      # toolchain, let the service rewrite its own code, and could ship with
      # no model when the build-time download failed quietly.
      - name: Check the image's contents
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh memoria:ci -c '
            set -e
            for dev in typescript vitest eslint; do
              if [ -e "node_modules/$dev" ]; then
                echo "::error::dev dependency $dev is in the runtime image"; exit 1
              fi
            done
            if [ -w dist/http.js ] || [ -w node_modules ]; then
              echo "::error::application code is writable by the runtime user"; exit 1
            fi
            [ -w /data/memoria ] || { echo "::error::/data/memoria is not writable"; exit 1; }
            [ -w "$HOME" ] || { echo "::error::HOME ($HOME) is not writable"; exit 1; }
            [ -n "$(ls -A .models)" ] || { echo "::error::no embedding model in .models"; exit 1; }
            echo "image contents OK, running as $(id -un)"
          '
      # The default embedding provider must actually load in the image:
      # offline, from the baked cache, as the runtime user. The Alpine image
      # could not load it at all, and nothing noticed, because the smoke test
      # below runs on hash embeddings.
      - name: Local embedding model loads in the image
        run: |
          docker run --rm --entrypoint node \
            -e MEMORIA_EMBEDDINGS=minilm -e MEMORIA_MODEL_OFFLINE=true \
            memoria:ci --input-type=module -e '
              const { embed } = await import("./dist/embeddings.js");
              const v = await embed("hello world");
              if (v.length !== 384) throw new Error("unexpected dimension " + v.length);
              console.log("MiniLM loads offline in the runtime image");
            '
      # Enabling the email source installs imapflow at runtime, as the runtime
      # user. Run that exact path with the real package: it caught a home-less
      # user whose npm could not create its cache, and it checks the named
      # export the adapter destructures survives the import.
      - name: On-demand adapter install works in the image
        run: |
          docker run --rm --entrypoint node memoria:ci --input-type=module -e '
            const deps = await import("./dist/collector/deps.js");
            deps.setAdapterModulesDir("/data/memoria/data/adapter-modules");
            const r = await deps.installDependencies(["imapflow"]);
            // "Installed", not "already installed": the step must run npm.
            if (!r.success || !r.message.startsWith("Installed")) throw new Error(r.message);
            const { ImapFlow } = await deps.importDependency("imapflow");
            if (typeof ImapFlow !== "function") throw new Error("ImapFlow export missing");
            console.log("adapter install + import OK:", r.message);
          '
      # Building proves it compiles; running proves the runtime stage is not
      # missing a file or a permission, and that the fail-closed posture check
      # in http.ts accepts a correct config. BIND_ALL is required for the
      # process to listen on 0.0.0.0 so the port mapping works, and BIND_ALL in
      # turn makes the other three mandatory. All four are ephemeral values
      # generated here for this container; none are real credentials.
      - name: Smoke-test the built image
        run: |
          set -euo pipefail
          docker run -d --name memoria-ci -p 3100:3100             -e BIND_ALL=true             -e MEMORIA_EMBEDDINGS=hash             -e MEMORIA_API_KEY="$(openssl rand -hex 16)"             -e MEMORIA_OAUTH_CLIENT_SECRET="$(openssl rand -hex 16)"             -e MEMORIA_ENCRYPTION_KEY="$(openssl rand -hex 32)"             -e MEMORIA_PUBLIC_URL=http://localhost:3100             memoria:ci
          ok=0
          for _ in $(seq 1 30); do
            # /health is unauthenticated and rate-limit exempt. Require the
            # actual body: any 5xx would otherwise pass as "it responded".
            if curl -fsS http://localhost:3100/health 2>/dev/null | grep -q '"status":"ok"'; then
              ok=1
              break
            fi
            sleep 2
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::container never returned a healthy /health response"
            docker logs memoria-ci
            docker rm -f memoria-ci >/dev/null 2>&1 || true
            exit 1
          fi
          echo "image serves /health"
          docker rm -f memoria-ci >/dev/null

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The public repo must never contain a credential or a memory file.
      #
      # This runs the gitleaks binary directly rather than gitleaks-action.
      # The action derives a commit range from the push event, and when that
      # range does not resolve — as happened on the merge that seeded this
      # repository from an unrelated history — it scans zero bytes and reports
      # "no leaks found in partial scan". That is a scanner that can pass
      # without having looked at anything, which is worse than no scanner. A
      # pinned binary over the full history is deterministic and matches what
      # runs locally.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
      # Two passes: every commit that has ever existed, then the working tree
      # (which also covers files that are only ever untracked in a PR).
      - name: Scan full git history
        run: ./gitleaks git . --no-banner --redact --config .gitleaks.toml
      - name: Scan working tree
        run: ./gitleaks dir . --no-banner --redact --config .gitleaks.toml
